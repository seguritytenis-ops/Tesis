<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar — STEPUP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#FAF7F2}.wrap{max-width:800px;margin:auto;padding:16px}input{width:100%;padding:14px;border-radius:12px;border:2px solid #ddd;font-size:16px}input:focus{border-color:#111;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}.card{background:#fff;border-radius:10px;padding:10px;text-align:center;text-decoration:none;color:#222}.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}.pr b{color:#C8102E}#n{color:#666;font-size:13px;margin-top:8px}</style></head><body><div class="wrap"><a href="/">← Volver</a><h1>Buscar tenis</h1><input id="q" placeholder="Ej: nike dunk, samba, rosado..." autocomplete="off"><div id="n"></div><div class="grid" id="r"></div></div><script>
var CAT=[];
fetch('/products/catalog.json').then(function(r){return r.json();}).then(function(j){CAT=j;go(qs||'');});
function fmt(n){return '$'+n.toLocaleString('es-CO');}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
var qs=new URLSearchParams(location.search).get('q')||'';
function go(q){
  q=norm(q);
  var out=CAT.filter(function(it){return !q||norm(it.t+' '+it.s).indexOf(q)>-1;}).slice(0,60);
  document.getElementById('n').innerText=out.length+' resultados';
  document.getElementById('r').innerHTML=out.map(function(it){
    return '<a class="card" href="/products/'+it.s+'/"><img loading="lazy" src="'+it.img+'"><div>'+it.t+'</div><div class="pr"><b>'+fmt(it.p)+'</b></div></a>';
  }).join('')||'<p>Sin resultados, prueba "nike", "samba", "rosado".</p>';
}
document.getElementById('q').addEventListener('input',function(e){go(e.target.value);});
if(qs)document.getElementById('q').value=qs;
</script></body></html>
