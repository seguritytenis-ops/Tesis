<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar — TENISI</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#faf7f2}.wrap{max-width:800px;margin:auto;padding:16px}input{width:100%;padding:14px;border-radius:12px;border:2px solid #ddd;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}.card{background:#fff;border-radius:10px;padding:10px;text-align:center;text-decoration:none;color:#222}.pr b{color:#d32f2f}</style></head><body><div class="wrap"><a href="/">← Volver</a><h1>Buscar tenis</h1><input id="q" placeholder="Ej: nike dunk, samba, rosado..." autocomplete="off"><div class="grid" id="r"></div></div><script>
var CAT=[];
fetch('/products/catalog.json').then(function(r){return r.json();}).then(function(j){CAT=j;go('');});
function fmt(n){return '$'+n.toLocaleString('es-CO');}
function go(q){
  q=(q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var out=CAT.filter(function(it){
    var t=(it.t+' '+it.s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return !q||t.indexOf(q)>-1;
  }).slice(0,60);
  document.getElementById('r').innerHTML=out.map(function(it){
    return '<a class="card" href="/products/'+it.s+'/"><b>'+it.t+'</b><div class="pr"><b>'+fmt(it.p)+'</b></div></a>';
  }).join('')||'<p>Sin resultados, prueba "nike", "samba", "rosado".</p>';
  var n=document.getElementById('n');if(n)n.innerText=out.length+' resultados';
}
document.getElementById('q').addEventListener('input',function(e){go(e.target.value);});
var qs=new URLSearchParams(location.search).get('q');if(qs){document.getElementById('q').value=qs;var iv=setInterval(function(){if(CAT.length){go(qs);clearInterval(iv);}},300);}
</script></body></html>
